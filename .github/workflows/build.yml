name: Build HTML to APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.techtok.app TechtokMarket
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Techtok-HTML-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/*.apk
