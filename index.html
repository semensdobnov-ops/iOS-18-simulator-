<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 18 Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; height: 100vh; height: 100dvh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .device { width: 100%; height: 100%; max-width: 430px; max-height: 932px; background: url('https://images.unsplash.com/photo-1620121692029-d088224ddc74?q=80&w=1000&auto=format&fit=crop') center/cover; position: relative; overflow: hidden; border-radius: 45px; box-shadow: 0 0 50px rgba(0,0,0,0.9); transition: background 0.5s ease; }

        /* Dynamic Island */
        .dynamic-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 2000; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; color: white; overflow: hidden; cursor: pointer; }
        .dynamic-island.expanded { width: 90%; height: 80px; border-radius: 30px; padding: 15px; justify-content: space-between;}
        .island-content { display: none; width: 100%; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600;}
        .dynamic-island.expanded .island-content { display: flex; }
        .dynamic-island.playing { width: 90%; height: 60px; border-radius: 30px; padding: 10px 15px; justify-content: space-between;}
        .dynamic-island.playing .island-content { display: none; }
        .island-playing { display: none; width: 100%; justify-content: space-between; align-items: center;}
        .dynamic-island.playing .island-playing { display: flex; }

        /* Lock Screen */
        #lock-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 80px 20px 30px; z-index: 10; transition: transform 0.5s ease, opacity 0.5s; }
        #lock-screen.unlocked { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        
        .time-lock { text-align: center; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .time-lock h1 { font-size: 96px; font-weight: 600; letter-spacing: -2px; line-height: 1; margin-left: -5px;}
        .time-lock p { font-size: 22px; font-weight: 500; margin-top: 10px;}
        .widgets-lock { width: 100%; display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
        .widget { padding: 15px; border-radius: 20px; color: white; flex: 1; text-align: left; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.1);}
        .widget h4 { font-size: 11px; text-transform: uppercase; opacity: 0.8; margin-bottom: 5px;}
        .widget p { font-size: 15px; font-weight: 600;}
        
        /* Кнопка разблокировки (вместо свайпа) */
        .unlock-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: pulse 2s infinite; }
        .unlock-btn:active { background: rgba(255,255,255,0.4); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Password Screen */
        #passcode-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1500; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #passcode-screen.active { display: flex; }
        .passcode-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .passcode-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #fff; }
        .passcode-dot.filled { background: #fff; }
        .passcode-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 80%; }
        .passcode-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 24px; font-weight: 600; cursor: pointer; margin: 0 auto; }
        .passcode-btn:active { background: rgba(255,255,255,0.3); }
        .forgot-btn { margin-top: 30px; color: #0a84ff; font-size: 16px; cursor: pointer; }

        /* Home Screen */
        #home-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 70px 20px; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.5s ease; opacity: 0; pointer-events: none; }
        #home-screen.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; row-gap: 25px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.1s; }
        .app-icon:active { transform: scale(0.85); opacity: 0.8; }
        .icon-box { width: 64px; height: 64px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 32px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); background: #fff; position: relative;}
        .app-icon span { color: white; font-size: 12px; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
        
        .ic-msg { background: linear-gradient(180deg, #5bf075 0%, #1cb332 100%); }
        .ic-cam { background: linear-gradient(180deg, #e5e5ea 0%, #a2a2a6 100%); }
        .ic-photos { background: linear-gradient(180deg, #ffea61 0%, #ff9500 50%, #ff2d55 100%); }
        .ic-settings { background: linear-gradient(180deg, #b0b0b5 0%, #8e8e93 100%); }
        .ic-calc { background: linear-gradient(180deg, #333 0%, #000 100%); color: white;}
        .ic-weather { background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%); }
        .ic-notes { background: linear-gradient(180deg, #f5f5dc 0%, #d4af37 100%); color: #333;}
        .ic-clock { background: linear-gradient(180deg, #fff 0%, #000 100%); }
        .ic-store { background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%); }
        .ic-flappy { background: #70c5ce; }
        .ic-ttt { background: #ff9500; }
        .ic-snake { background: #34c759; }

        .dock { position: absolute; bottom: 25px; left: 15px; right: 15px; padding: 12px 15px; border-radius: 35px; display: flex; justify-content: space-around; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.1); }
        .dock .icon-box { width: 60px; height: 60px; border-radius: 15px; font-size: 30px; box-shadow: none; }

        /* App Screens */
        .app-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; transform: translateY(100%); transition: transform 0.4s ease; display: flex; flex-direction: column; border-radius: 45px; overflow: hidden;}
        .app-screen.active { transform: translateY(0); }
        .app-header { padding: 60px 20px 15px; display: flex; align-items: center; gap: 10px; background: #1c1c1e; color: #fff; position: sticky; top: 0; z-index: 10; }
        .back-btn { font-size: 20px; color: #0a84ff; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 5px;}
        .app-header h2 { font-size: 18px; font-weight: 600; margin-left: auto; margin-right: auto; transform: translateX(-20px);}
        .app-content { flex: 1; overflow-y: auto; padding: 20px; background: #000; color: #fff; }

        /* Control Center */
        #control-center { position: absolute; top: -100%; right: 0; width: 100%; height: 100%; z-index: 900; transition: top 0.3s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: rgba(0,0,0,0.8);}
        #control-center.active { top: 0; }
        .cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 350px;}
        .cc-card { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 15px; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; font-weight: 600; cursor: pointer;}
        .cc-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; transition: 0.2s;}
        .cc-btn.active { background: #fff; color: #000; }
        .cc-slider { width: 100%; height: 120px; background: rgba(255,255,255,0.2); border-radius: 20px; position: relative; overflow: hidden; display: flex; flex-direction: column-reverse; margin-bottom: 10px;}
        .cc-slider-fill { width: 100%; background: #fff; }

        /* Settings & Apps */
        .settings-item { background: #1c1c1e; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; cursor: pointer;}
        .settings-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; justify-content: center; align-items: center; margin-right: 10px; font-size: 18px;}
        
        .msg-bubble { max-width: 80%; padding: 10px 15px; margin-bottom: 10px; font-size: 14px; border: 1px solid #333; border-radius: 20px;}
        .msg-in { background: #26262a; align-self: flex-start; border-radius: 0 15px 15px 15px; }
        .msg-out { background: #0a84ff; align-self: flex-end; border-radius: 15px 0 15px 15px; }
        .chat-input-area { display: flex; gap: 10px; margin-top: 20px; position: absolute; bottom: 20px; left: 20px; right: 20px;}
        .chat-input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #1c1c1e; color: white; outline: none; }
        .chat-send { background: #0a84ff; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; }

        .store-card { background: #1c1c1e; border-radius: 15px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .store-icon { width: 60px; height: 60px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 30px; }
        .store-info { flex: 1; }
        .store-info h3 { color: #fff; font-size: 16px; margin-bottom: 5px; }
        .store-info p { color: #888; font-size: 12px; margin-bottom: 10px; }
        .store-btn { background: #0a84ff; color: white; border: none; padding: 6px 15px; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .install-progress { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 10px; overflow: hidden; display: none;}
        .install-progress-fill { height: 100%; background: #0a84ff; width: 0%; transition: width 0.1s;}

        .weather-ui { display: flex; flex-direction: column; align-items: center; justify-content: space-between; color: white; height: 100%; padding: 40px 20px; background: linear-gradient(180deg, #4a90e2, #001f3f);}
        .weather-ui h1 { font-size: 80px; font-weight: 200; }
        .weather-ui .hourly { display: flex; gap: 15px; overflow-x: auto; width: 100%; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px;}
        .weather-ui .hourly div { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 14px;}

        .clock-tabs { display: flex; justify-content: space-around; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;}
        .clock-tab { color: #888; cursor: pointer; font-weight: 600; font-size: 16px;}
        .clock-tab.active { color: #fff; }
        .stopwatch-display { font-size: 60px; font-weight: 200; text-align: center; margin: 30px 0; font-variant-numeric: tabular-nums;}
        .timer-input { width: 100%; padding: 15px; background: #1c1c1e; border: none; color: white; font-size: 24px; text-align: center; border-radius: 10px; margin-bottom: 20px;}
        .calc-btn-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px;}
        .clock-btn { width: 80px; height: 80px; border-radius: 50%; border: 2px solid; font-size: 18px; font-weight: bold; cursor: pointer;}
        .btn-green { border-color: #34c759; color: #34c759; background: rgba(52,199,89,0.1);}
        .btn-red { border-color: #ff3b30; color: #ff3b30; background: rgba(255,59,48,0.1);}
        
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 300px; margin: 20px auto; }
        .ttt-cell { width: 100px; height: 100px; background: #1c1c1e; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; color: white; cursor: pointer; }
        .snake-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 1px; background: #333; border: 2px solid #333; width: 300px; height: 300px; margin: 20px auto; }
        .snake-cell { background: #111; width: 100%; height: 100%; }
        .snake-cell.snake { background: #34c759; }
        .snake-cell.food { background: #ff2d55; border-radius: 50%; }
        #game-canvas { display: block; margin: 0 auto; background: #70c5ce; border: 2px solid #fff; border-radius: 8px; }
        .game-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; border-radius: 45px;}
        .game-overlay.active { display: flex; }
    </style>
</head>
<body>

    <div class="device" id="device">
        
        <div class="dynamic-island" id="dynamic-island" onclick="toggleIsland()">
            <div style="font-size: 10px; opacity: 0.5;">⬛</div>
            <div class="island-playing">
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="color:#0a84ff; font-size:20px;" id="island-icon">🎵</span>
                    <div>
                        <div style="font-size:10px; color:#888; margin-bottom:2px;" id="island-subtext">Играет сейчас</div>
                        <div style="font-size:13px;" id="island-title">Nexi - aeth is goat</div>
                    </div>
                </div>
                <div style="display:flex; gap:15px; font-size:18px;">
                    <span onclick="event.stopPropagation(); prevTrack()">⏮</span>
                    <span onclick="event.stopPropagation(); togglePlay()" id="island-play-btn">⏸</span>
                    <span onclick="event.stopPropagation(); nextTrack()">⏭</span>
                </div>
            </div>
        </div>

        <div id="lock-screen">
            <div class="time-lock">
                <h1 id="time-display">09:41</h1>
                <p>Четверг, 26 сентября</p>
            </div>
            <div class="widgets-lock">
                <div class="widget"><h4>Погода</h4><p>+21° Облачно</p></div>
                <div class="widget"><h4>Календарь</h4><p>Встреча в 15:00</p></div>
            </div>
            <!-- Кнопка вместо свайпа -->
            <button class="unlock-btn" onclick="openPasscode()">Разблокировать</button>
        </div>

        <div id="passcode-screen">
            <h2 style="margin-bottom: 20px;">Введите код-пароль</h2>
            <div class="passcode-dots" id="passcode-dots">
                <div class="passcode-dot"></div><div class="passcode-dot"></div><div class="passcode-dot"></div><div class="passcode-dot"></div>
            </div>
            <div class="passcode-keypad" id="keypad"></div>
            <div class="forgot-btn" onclick="forgotPasscode()">Забыли код?</div>
        </div>

        <div id="home-screen">
            <div class="app-grid" id="app-grid">
                <div class="app-icon" onclick="openApp('msg')"><div class="icon-box ic-msg">💬</div><span>Сообщения</span></div>
                <div class="app-icon" onclick="openApp('notes')"><div class="icon-box ic-notes">📝</div><span>Заметки</span></div>
                <div class="app-icon" onclick="openApp('calc')"><div class="icon-box ic-calc">🧮</div><span>Калькулятор</span></div>
                <div class="app-icon" onclick="openApp('weather')"><div class="icon-box ic-weather">☀️</div><span>Погода</span></div>
                <div class="app-icon" onclick="openApp('store')"><div class="icon-box ic-store">🅰️</div><span>App Store</span></div>
                <div class="app-icon" onclick="openApp('clock')"><div class="icon-box ic-clock">🕒</div><span>Часы</span></div>
                <div class="app-icon" onclick="openApp('settings')"><div class="icon-box ic-settings">⚙️</div><span>Настройки</span></div>
            </div>
            <div class="dock">
                <div class="icon-box" style="background:#34c759" onclick="openControlCenter()">📞</div>
                <div class="icon-box" style="background:#007aff" onclick="openApp('safari')">🌐</div>
                <div class="icon-box ic-msg" onclick="openApp('msg')">💬</div>
                <div class="icon-box ic-cam" onclick="openApp('cam')">📷</div>
            </div>
        </div>

        <div id="control-center">
            <div class="cc-grid">
                <div class="cc-slider"><div class="cc-slider-fill" style="height: 60%;"></div></div>
                <div class="cc-slider"><div class="cc-slider-fill" style="height: 30%;"></div></div>
                <div class="cc-card" onclick="this.querySelector('.cc-btn').classList.toggle('active')">
                    <div class="cc-btn active">✈️</div>
                </div>
                <div class="cc-card" onclick="this.querySelectorAll('.cc-btn').forEach(b=>b.classList.toggle('active'))">
                    <div class="cc-btn active">📶</div>
                    <div class="cc-btn active">🔵</div>
                </div>
            </div>
            <div style="position:absolute; bottom: 40px; color: white; text-align: center; opacity: 0.6; cursor:pointer;" onclick="closeControlCenter()">Нажмите, чтобы закрыть</div>
        </div>

        <div id="app-screen" class="app-screen">
            <div class="app-header">
                <div class="back-btn" onclick="closeApp()">‹ Назад</div>
                <h2 id="app-title">Приложение</h2>
            </div>
            <div class="app-content" id="app-content"></div>
        </div>

    </div>

    <script>
        // --- SYSTEM ---
        function updateTime() {
            const now = new Date();
            const display = document.getElementById('time-display');
            if(display) display.innerText = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }
        setInterval(updateTime, 1000); updateTime();

        // --- PASSWORD LOGIC ---
        let savedPasscode = localStorage.getItem('ios_passcode') || null;
        let currentInput = '';

        function initKeypad() {
            const keypad = document.getElementById('keypad');
            keypad.innerHTML = '';
            for(let i=1; i<=9; i++) {
                let btn = document.createElement('button');
                btn.className = 'passcode-btn'; btn.innerText = i;
                btn.onclick = () => addDigit(i);
                keypad.appendChild(btn);
            }
            let empty = document.createElement('div'); keypad.appendChild(empty);
            let zero = document.createElement('button'); zero.className = 'passcode-btn'; zero.innerText = '0'; zero.onclick = () => addDigit(0); keypad.appendChild(zero);
            let del = document.createElement('button'); del.className = 'passcode-btn'; del.innerText = '⌫'; del.onclick = () => removeDigit(); keypad.appendChild(del);
        }
        initKeypad();

        function openPasscode() {
            if(!savedPasscode) {
                unlock();
                return;
            }
            document.getElementById('passcode-screen').classList.add('active');
            currentInput = '';
            updateDots();
        }

        function addDigit(digit) {
            if(currentInput.length < 4) {
                currentInput += digit;
                updateDots();
                if(currentInput.length === 4) {
                    setTimeout(checkPasscode, 200);
                }
            }
        }

        function removeDigit() {
            if(currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            const dots = document.querySelectorAll('.passcode-dot');
            dots.forEach((dot, index) => {
                if(index < currentInput.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
        }

        function checkPasscode() {
            if(currentInput === savedPasscode) {
                document.getElementById('passcode-screen').classList.remove('active');
                unlock();
            } else {
                alert("Неверный код!");
                currentInput = '';
                updateDots();
            }
        }

        function forgotPasscode() {
            if(savedPasscode) {
                alert(`Ваш код-пароль: ${savedPasscode}`);
            } else {
                alert("Пароль не задан.");
            }
        }

        function unlock() {
            document.getElementById('lock-screen').classList.add('unlocked');
            setTimeout(() => { document.getElementById('home-screen').classList.add('active'); }, 200);
        }

        // --- CONTROL CENTER ---
        function openControlCenter() { document.getElementById('control-center').classList.add('active'); }
        function closeControlCenter() { document.getElementById('control-center').classList.remove('active'); }

        // --- APPS ---
        let calcValue = '';
        let notes = JSON.parse(localStorage.getItem('ios_notes') || '[]');
        let messages = JSON.parse(localStorage.getItem('ios_messages') || '[{"text":"Привет! Как дела?","type":"in"}]');
        
        function openApp(app) {
            const screen = document.getElementById('app-screen');
            const title = document.getElementById('app-title');
            const content = document.getElementById('app-content');
            screen.classList.add('active');
            content.innerHTML = '';
            content.style.padding = '20px';

            if (app === 'msg') {
                title.innerText = "Сообщения";
                content.style.padding = '0';
                content.innerHTML = `<div class="app-content" style="padding-bottom: 80px;" id="chat-history"></div><div class="chat-input-area"><input type="text" class="chat-input" id="msg-input" placeholder="Сообщение..."><button class="chat-send" onclick="sendMsg()">➤</button></div>`;
                renderMessages();
            }
            else if (app === 'calc') {
                title.innerText = "Калькулятор";
                content.style.padding = '0';
                content.innerHTML = `
                    <div class="calc-display" id="calc-display">0</div>
                    <div class="calc-grid">
                        <button class="calc-btn clear" onclick="calcClear()">AC</button>
                        <button class="calc-btn clear" onclick="calcInput('+/-')">+/-</button>
                        <button class="calc-btn clear" onclick="calcInput('%')">%</button>
                        <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                        <button class="calc-btn" onclick="calcInput('7')">7</button>
                        <button class="calc-btn" onclick="calcInput('8')">8</button>
                        <button class="calc-btn" onclick="calcInput('9')">9</button>
                        <button class="calc-btn op" onclick="calcInput('*')">×</button>
                        <button class="calc-btn" onclick="calcInput('4')">4</button>
                        <button class="calc-btn" onclick="calcInput('5')">5</button>
                        <button class="calc-btn" onclick="calcInput('6')">6</button>
                        <button class="calc-btn op" onclick="calcInput('-')">-</button>
                        <button class="calc-btn" onclick="calcInput('1')">1</button>
                        <button class="calc-btn" onclick="calcInput('2')">2</button>
                        <button class="calc-btn" onclick="calcInput('3')">3</button>
                        <button class="calc-btn op" onclick="calcInput('+')">+</button>
                        <button class="calc-btn zero" onclick="calcInput('0')">0</button>
                        <button class="calc-btn" onclick="calcInput('.')">,</button>
                        <button class="calc-btn op" onclick="calcInput('=')">=</button>
                    </div>
                `;
            }
            else if (app === 'weather') {
                title.innerText = "Погода";
                content.style.padding = '0';
                content.innerHTML = `
                    <div class="weather-ui">

                        <h1>+21°</h1>
                        <p>Облачно</p>
                        <div class="hourly">

                            <div><span>14:00</span><span>🌧️</span><span>+19°</span></div>
                            <div><span>15:00</span><span>☀️</span><span>+23°</span></div>
                            <div><span>16:00</span><span>☀️</span><span>+24°</span></div>
                        </div>
                        <div style="width: 100%; text-align: left; color: rgba(255,255,255,0.8); font-size: 14px;">Ветер: 3 м/с • Влажность: 45%</div>
                    </div>
                `;
            }
            else if (app === 'clock') {
                title.innerText = "Часы";
                content.innerHTML = `
                    <div class="clock-tabs">
                        <div class="clock-tab active" onclick="switchClockTab('stopwatch')">Секундомер</div>
                        <div class="clock-tab" onclick="switchClockTab('timer')">Таймер</div>
                    </div>
                    <div id="clock-content"></div>
                `;
                switchClockTab('stopwatch');
            }
            else if (app === 'settings') {
                title.innerText = "Настройки";
                content.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div class="settings-item" onclick="changeWallpaper()">
                            <div style="display: flex; align-items: center;"><div class="settings-icon" style="background:#007aff;">🖼</div> Обои</div> <span style="color:#888;">></span>
                        </div>
                        <div class="settings-item" onclick="setPasscode()">
                            <div style="display: flex; align-items: center;"><div class="settings-icon" style="background:#ff3b30;">🔒</div> Код-пароль</div> <span style="color:#888;">></span>
                        </div>
                        <div class="settings-item">
                            <div style="display: flex; align-items: center;"><div class="settings-icon" style="background:#34c759;">📶</div> Wi-Fi</div> <span style="color:#0a84ff;">Домашняя ></span>
                        </div>
                    </div>
                `;
            }
            else if (app === 'store') {
                title.innerText = "App Store";
                content.innerHTML = `
                    <div class="store-card" id="store-card-Flappy">
                        <div class="store-icon ic-flappy">🐦</div>
                        <div class="store-info"><h3>Flappy Bird</h3><p>Аркада</p>
                            <div class="install-progress" id="progress-Flappy"><div class="install-progress-fill"></div></div>
                            <button class="store-btn" id="btn-Flappy" onclick="installApp('Flappy')">Установить</button>
                        </div>
                    </div>
                    <div class="store-card" id="store-card-TTT">
                        <div class="store-icon ic-ttt">❌</div>
                        <div class="store-info"><h3>Крестики-нолики</h3><p>Логика</p>
                            <div class="install-progress" id="progress-TTT"><div class="install-progress-fill"></div></div>
                            <button class="store-btn" id="btn-TTT" onclick="installApp('TTT')">Установить</button>
                        </div>
                    </div>
                    <div class="store-card" id="store-card-Snake">
                        <div class="store-icon ic-snake">🐍</div>
                        <div class="store-info"><h3>Змейка</h3><p>Аркада</p>
                            <div class="install-progress" id="progress-Snake"><div class="install-progress-fill"></div></div>
                            <button class="store-btn" id="btn-Snake" onclick="installApp('Snake')">Установить</button>
                        </div>
                    </div>
                `;
            }
            else {
                title.innerText = "Приложение";
                content.innerHTML = `<div style="text-align:center; margin-top:50px; color:#888;">🚧 В разработке</div>`;
            }
        }

        function closeApp() {
            document.getElementById('app-screen').classList.remove('active');
            if(gameInterval) clearInterval(gameInterval);
            if(stopwatchInterval) clearInterval(stopwatchInterval);
            if(timerInterval) clearInterval(timerInterval);
        }

        // --- SETTINGS FUNCTIONS ---
        function changeWallpaper() {
            const wallpapers = [
                'https://images.unsplash.com/photo-1620121692029-d088224ddc74?q=80&w=1000&auto=format&fit=crop',
                'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop',
                'https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=1000&auto=format&fit=crop',
                '#1a0b2e'
            ];
            let current = localStorage.getItem('ios_wallpaper_index') || 0;
            current = (parseInt(current) + 1) % wallpapers.length;
            localStorage.setItem('ios_wallpaper_index', current);
            document.getElementById('device').style.background = wallpapers[current];
        }

        function setPasscode() {
            let newCode = prompt("Введите новый 4-значный код (или оставьте пустым, чтобы удалить):");
            if(newCode === null) return;
            if(newCode === "") {
                localStorage.removeItem('ios_passcode');
                savedPasscode = null;
                alert("Код удален.");
            } else if(newCode.length === 4 && !isNaN(newCode)) {
                localStorage.setItem('ios_passcode', newCode);
                savedPasscode = newCode;
                alert("Код успешно установлен!");
            } else {
                alert("Ошибка: код должен быть из 4 цифр.");
            }
        }

        // --- MESSAGES ---
        function renderMessages() {
            const history = document.getElementById('chat-history');
            if(!history) return;
            history.innerHTML = '';
            messages.forEach(msg => {
                history.innerHTML += `<div class="msg-bubble ${msg.type === 'in' ? 'msg-in' : 'msg-out'}">${msg.text}</div>`;
            });
            history.scrollTop = history.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if(!input || input.value.trim() === '') return;
            messages.push({text: input.value.trim(), type: 'out'});
            localStorage.setItem('ios_messages', JSON.stringify(messages));
            input.value = '';
            renderMessages();
            
            setTimeout(() => {
                messages.push({text: "Это автоматический ответ. Круто, да?", type: 'in'});
                localStorage.setItem('ios_messages', JSON.stringify(messages));
                renderMessages();
            }, 1000);
        }

        // --- CALC ---
        function calcInput(val) {
            const display = document.getElementById('calc-display');
            if(!display) return;
            if (val === '=') {
                try {
                    let result = eval(calcValue);
                    if (result === undefined || isNaN(result)) throw "Error";
                    display.innerText = result;
                    calcValue = result.toString();
                } catch (e) { display.innerText = "Ошибка"; calcValue = ''; }
            } else if (val === 'AC') {
                calcValue = ''; display.innerText = '0';
            } else if (val === '+/-') {
                if (calcValue) { calcValue = (parseFloat(calcValue) * -1).toString(); display.innerText = calcValue; }
            } else {
                calcValue += val;
                display.innerText = calcValue.replace(/\*/g, '×').replace(/\//g, '÷');
            }
        }
        function calcClear() { calcValue = ''; document.getElementById('calc-display').innerText = '0'; }

        // --- CLOCK ---
        let stopwatchInterval, timerInterval;
        let stopwatchTime = 0, timerTime = 0;
        
        function switchClockTab(tab) {
            document.querySelectorAll('.clock-tab').forEach(t => t.classList.remove('active'));
            if(event) event.target.classList.add('active');
            
            clearInterval(stopwatchInterval);
            clearInterval(timerInterval);
            
            const content = document.getElementById('clock-content');
            if(!content) return;
            
            if(tab === 'stopwatch') {
                content.innerHTML = `
                    <div class="stopwatch-display" id="sw-display">00:00.00</div>
                    <div class="calc-btn-row">
                        <button class="clock-btn btn-green" onclick="startStopwatch()">Старт</button>
                        <button class="clock-btn btn-red" onclick="resetStopwatch()">Сброс</button>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <input type="number" class="timer-input" id="timer-set" placeholder="Секунды" value="${timerTime || ''}">
                    <div class="stopwatch-display" id="timer-display">${formatTime(timerTime || 0)}</div>
                    <div class="calc-btn-row">
                        <button class="clock-btn btn-green" onclick="startTimer()">Старт</button>
                        <button class="clock-btn btn-red" onclick="resetTimer()">Сброс</button>
                    </div>
                `;
            }
        }

        function formatTime(ms) {
            let sec = Math.floor(ms / 1000);
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function startStopwatch() {
            clearInterval(stopwatchInterval);
            let start = Date.now() - stopwatchTime;
            stopwatchInterval = setInterval(() => {
                stopwatchTime = Date.now() - start;
                let min = Math.floor(stopwatchTime / 60000);
                let sec = Math.floor((stopwatchTime % 60000) / 1000);
                let ms = Math.floor((stopwatchTime % 1000) / 10);
                const display = document.getElementById('sw-display');
                if(display) display.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
            }, 10);
        }

        function resetStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchTime = 0;
            const display = document.getElementById('sw-display');
            if(display) display.innerText = `00:00.00`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            let input = document.getElementById('timer-set').value;
            if(input) timerTime = input * 1000;
            let start = Date.now();
            timerInterval = setInterval(() => {
                let elapsed = Date.now() - start;
                let remaining = timerTime - elapsed;
                if(remaining <= 0) {
                    clearInterval(timerInterval);
                    const display = document.getElementById('timer-display');
                    if(display) display.innerText = "00:00";
                    alert("Время вышло!");
                } else {
                    const display = document.getElementById('timer-display');
                    if(display) display.innerText = formatTime(remaining);
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerTime = 0;
            const display = document.getElementById('timer-display');
            if(display) display.innerText = `00:00`;
        }

        // --- APPS INSTALL ---
        function installApp(appName) {
            const progressBar = document.getElementById('progress-' + appName);
            const btn = document.getElementById('btn-' + appName);
            if(!progressBar || !btn) return;
            if(progressBar.style.display === 'block') return;
            
            progressBar.style.display = 'block';
            btn.innerText = "Загрузка...";
            btn.disabled = true;
            let progress = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 20;
                if(progress > 100) progress = 100;
                progressBar.querySelector('.install-progress-fill').style.width = progress + '%';
                
                if(progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        let card = document.getElementById('store-card-' + appName);
                        if(card) card.style.display = 'none';
                        
                        const homeGrid = document.getElementById('app-grid');
                        const newApp = document.createElement('div');
                        newApp.className = 'app-icon';
                        
                        if(appName === 'Flappy') newApp.innerHTML = `<div class="icon-box ic-flappy">🐦</div><span>Flappy</span>`;
                        if(appName === 'TTT') newApp.innerHTML = `<div class="icon-box ic-ttt">❌</div><span>Крестики</span>`;
                        if(appName === 'Snake') newApp.innerHTML = `<div class="icon-box ic-snake">🐍</div><span>Змейка</span>`;
                        
                        newApp.onclick = () => {
                            if(appName === 'Flappy') playFlappy();
                            if(appName === 'TTT') playTTT();
                            if(appName === 'Snake') playSnake();
                        };
                        homeGrid.appendChild(newApp);
                    }, 500);
                }
            }, 200);
        }

        // --- GAMES ---
        let gameInterval;
        function playFlappy() {
            const screen = document.getElementById('app-screen');
            const title = document.getElementById('app-title');
            const content = document.getElementById('app-content');
            screen.classList.add('active');
            title.innerText = "Flappy Bird";
            content.style.padding = '0';
            content.innerHTML = `
                <div style="flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000;">
                    <canvas id="game-canvas" width="320" height="480"></canvas>
                    <div class="game-overlay" id="gameOverlay">
                        <h2 style="color: #fff; margin-bottom: 20px;">Игра окончена</h2>
                        <p style="color: #fff; margin-bottom: 20px;">Счет: <span id="finalScore" style="color: #ffdf6b; font-weight: bold; font-size: 24px;">0</span></p>
                        <button class="store-btn" style="padding: 12px 24px; font-size: 16px;" onclick="resetFlappy()">Играть снова</button>
                        <button class="store-btn" style="padding: 12px 24px; font-size: 16px; background: #333; margin-top: 10px;" onclick="closeApp()">Выход</button>
                    </div>
                </div>
            `;
            resetFlappy();
            document.getElementById('game-canvas').addEventListener('touchstart', (e) => { if(!isGameOver) velocity = -7; });
            document.getElementById('game-canvas').addEventListener('mousedown', (e) => { if(!isGameOver) velocity = -7; });
        }

        let birdY, velocity, pipes, score, isGameOver;
        function resetFlappy() {
            const canvas = document.getElementById('game-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            birdY = 240; velocity = 0; pipes = []; score = 0; isGameOver = false;
            document.getElementById('gameOverlay').classList.remove('active');
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                if(isGameOver) return;
                velocity += 0.5; birdY += velocity;
                if(birdY > 460 || birdY < 0) { isGameOver = true; document.getElementById('finalScore').innerText = score; document.getElementById('gameOverlay').classList.add('active'); }
                if(pipes.length === 0 || pipes[pipes.length-1].x < 200) {
                    let gap = 120, topPipeHeight = Math.random() * (canvas.height - gap - 100) + 50;
                    pipes.push({x: canvas.width, top: topPipeHeight, bottom: canvas.height - topPipeHeight - gap, passed: false});
                }
                pipes.forEach(p => {
                    p.x -= 2;
                    if(p.x < 40 && p.x > 10 && (birdY < p.top || birdY > canvas.height - p.bottom)) { isGameOver = true; document.getElementById('finalScore').innerText = score; document.getElementById('gameOverlay').classList.add('active'); }
                    if(p.x < 40 && p.x > 10 && !p.passed) { p.passed = true; score++; }
                });
                pipes = pipes.filter(p => p.x > -50);
                
                ctx.fillStyle = '#70c5ce'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffdf6b'; ctx.fillRect(50, birdY, 24, 18);
                ctx.fillStyle = '#34c759';
                pipes.forEach(p => { ctx.fillRect(p.x, 0, 40, p.top); ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom); });
                ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.fillText('Счёт: ' + score, 10, 30);
            }, 1000/60);
        }

        let tttBoard = [], tttPlayer = 'X', tttActive = false;
        function playTTT() {
            const screen = document.getElementById('app-screen');
            const title = document.getElementById('app-title');
            const content = document.getElementById('app-content');
            screen.classList.add('active');
            title.innerText = "Крестики-нолики";
            content.style.padding = '20px';
            content.innerHTML = `
                <div style="text-align: center;">
                    <h3 style="color: #fff; margin-bottom: 10px;">Твой ход: <span id="ttt-turn">X</span></h3>
                    <div class="ttt-grid" id="ttt-grid"></div>
                    <button class="store-btn" style="margin-top: 20px; padding: 10px 20px;" onclick="playTTT()">Начать заново</button>
                </div>
            `;
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            tttPlayer = 'X'; tttActive = true;
            renderTTT();
        }

        function renderTTT() {
            const grid = document.getElementById('ttt-grid');
            if(!grid) return;
            grid.innerHTML = '';
            tttBoard.forEach((cell, i) => {
                let div = document.createElement('div');
                div.className = 'ttt-cell';
                div.innerText = cell;
                div.onclick = () => {
                    if(cell === '' && tttActive) {
                        tttBoard[i] = tttPlayer;
                        tttPlayer = tttPlayer === 'X' ? 'O' : 'X';
                        document.getElementById('ttt-turn').innerText = tttPlayer;
                        renderTTT();
                        checkTTT();
                    }
                };
                grid.appendChild(div);
            });
        }

        function checkTTT() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let w of wins) {
                if(tttBoard[w[0]] && tttBoard[w[0]] === tttBoard[w[1]] && tttBoard[w[0]] === tttBoard[w[2]]) {
                    alert(`Победил ${tttBoard[w[0]]}!`); tttActive = false; return;
                }
            }
            if(!tttBoard.includes('')) { alert("Ничья!"); tttActive = false; }
        }

        let snake, snakeDir, food, snakeTimer;
        function playSnake() {
            const screen = document.getElementById('app-screen');
            const title = document.getElementById('app-title');
            const content = document.getElementById('app-content');
            screen.classList.add('active');
            title.innerText = "Змейка";
            content.style.padding = '20px';
            content.innerHTML = `
                <div style="text-align: center;">
                    <h3 style="color: #fff; margin-bottom: 10px;">Счёт: <span id="snake-score">0</span></h3>
                    <div class="snake-grid" id="snake-grid"></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; width: 200px; margin-left: auto; margin-right: auto;">
                        <div></div><button class="store-btn" onclick="changeSnakeDir(0, -1)">⬆️</button><div></div>
                        <button class="store-btn" onclick="changeSnakeDir(-1, 0)">⬅️</button>
                        <div></div>
                        <button class="store-btn" onclick="changeSnakeDir(1, 0)">➡️</button>
                        <div></div><button class="store-btn" onclick="changeSnakeDir(0, 1)">⬇️</button><div></div>
                    </div>
                    <button class="store-btn" style="margin-top: 20px; padding: 10px 20px;" onclick="startSnake()">Начать заново</button>
                </div>
            `;
            startSnake();
        }

        function startSnake() {
            if(snakeTimer) clearInterval(snakeTimer);
            snake = [{x: 7, y: 7}];
            snakeDir = {x: 0, y: -1};
            food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)};
            let score = 0;
            document.getElementById('snake-score').innerText = score;
            
            snakeTimer = setInterval(() => {
                const head = {x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y};
                if(head.x < 0 || head.x >= 15 || head.y < 0 || head.y >= 15 || snake.some(s => s.x === head.x && s.y === head.y)) {
                    clearInterval(snakeTimer);
                    alert("Игра окончена! Счёт: " + score); return;
                }
                snake.unshift(head);
                if(head.x === food.x && head.y === food.y) {
                    score++; document.getElementById('snake-score').innerText = score;
                    food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)};
                } else { snake.pop(); }
                renderSnake();
            }, 200);
        }

        function renderSnake() {
            const grid = document.getElementById('snake-grid');
            if(!grid) return;
            grid.innerHTML = '';
            for(let y=0; y<15; y++) {
                for(let x=0; x<15; x++) {
                    let div = document.createElement('div');
                    div.className = 'snake-cell';
                    if(snake.some(s => s.x === x && s.y === y)) div.classList.add('snake');
                    if(food.x === x && food.y === y) div.classList.add('food');
                    grid.appendChild(div);
                }
            }
        }

        function changeSnakeDir(x, y) {
            if(snakeDir.x === -x && snakeDir.y === -y) return;
            snakeDir = {x, y};
        }

        // --- DYNAMIC ISLAND ---
        const island = document.getElementById('dynamic-island');
        function toggleIsland() {
            island.classList.toggle('expanded');
        }
    </script>
